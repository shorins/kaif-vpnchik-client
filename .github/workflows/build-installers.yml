name: Build kaif vpnchik installers

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS Apple Silicon DMG
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows x64 NSIS installer
        required: true
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: --max_old_space_size=4096
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            enabled_input: build_macos
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact_name: kaif-vpnchik-macos-aarch64-dmg
            artifact_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64 NSIS installer
            enabled_input: build_windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact_name: kaif-vpnchik-windows-x64-nsis
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - name: Skip if disabled
        if: github.event.inputs[matrix.enabled_input] != 'true'
        run: echo "Skipping ${{ matrix.name }}"

      - name: Checkout
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/checkout@v6

      - name: Install Rust
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: kaif-${{ matrix.os }}-${{ matrix.target }}
          workspaces: . -> target

      - name: Install pnpm
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install Node
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies and runtime resources
        if: github.event.inputs[matrix.enabled_input] == 'true'
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Build installer
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Add macOS help.txt to DMG
        if: github.event.inputs[matrix.enabled_input] == 'true' && matrix.os == 'macos-latest'
        run: node scripts/rebuild-macos-dmg-with-help.mjs ${{ matrix.target }}

      - name: Upload installer
        if: github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          archive: false
