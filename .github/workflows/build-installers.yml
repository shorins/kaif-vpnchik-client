name: Build kaif vpnchik installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS Apple Silicon DMG
        required: true
        type: boolean
        default: true
      build_windows:
        description: Build Windows x64 NSIS installer
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  HUSKY: 0
  NODE_OPTIONS: --max_old_space_size=4096
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-release-notes:
    name: Generate release notes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      previous_tag: ${{ steps.tags.outputs.previous_tag }}
      has_previous_tag: ${{ steps.tags.outputs.has_previous_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect previous tag
        id: tags
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -E '^v' | grep -vx "$CURRENT_TAG" | head -n 1 || true)"

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
            echo "has_previous_tag=true" >> "$GITHUB_OUTPUT"
            echo "Found previous tag: $PREVIOUS_TAG"
          else
            echo "previous_tag=" >> "$GITHUB_OUTPUT"
            echo "has_previous_tag=false" >> "$GITHUB_OUTPUT"
            echo "No previous tag found. Will include all merged PRs to dev up to this tag."
          fi

      - name: Build release notes from merged PR titles
        uses: actions/github-script@v8
        env:
          CURRENT_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous_tag }}
          HAS_PREVIOUS_TAG: ${{ steps.tags.outputs.has_previous_tag }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const currentTag = process.env.CURRENT_TAG;
            const previousTag = process.env.PREVIOUS_TAG;
            const hasPreviousTag = process.env.HAS_PREVIOUS_TAG === 'true';
            const { owner, repo } = context.repo;

            const tagCommitResp = await github.rest.repos.getCommit({
              owner,
              repo,
              ref: currentTag,
            });
            const tagCommitDate = new Date(tagCommitResp.data.commit.committer.date);

            const prMap = new Map();

            if (hasPreviousTag) {
              const compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousTag}...${currentTag}`,
              });

              for (const commit of compare.data.commits) {
                try {
                  const prsResp = await github.request(
                    'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
                    {
                      owner,
                      repo,
                      commit_sha: commit.sha,
                      mediaType: { previews: ['groot'] },
                    }
                  );

                  for (const pr of prsResp.data) {
                    if (!pr.merged_at) continue;
                    if (pr.base?.ref !== 'dev') continue;
                    prMap.set(pr.number, pr);
                  }
                } catch (error) {
                  core.warning(`Failed to map commit ${commit.sha} to PR: ${error.message}`);
                }
              }
            } else {
              const prs = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'closed',
                base: 'dev',
                sort: 'updated',
                direction: 'desc',
                per_page: 100,
              });

              for (const pr of prs) {
                if (!pr.merged_at) continue;
                const mergedAt = new Date(pr.merged_at);
                if (mergedAt <= tagCommitDate) {
                  prMap.set(pr.number, pr);
                }
              }
            }

            const prs = Array.from(prMap.values())
              .sort((a, b) => new Date(a.merged_at) - new Date(b.merged_at));

            const title = `## What's new`;
            const rangeLine = hasPreviousTag
              ? `_Changes from ${previousTag} to ${currentTag} (merged into dev)_`
              : `_Changes up to ${currentTag} (merged into dev)_`;

            const prLines = prs.length
              ? prs.map((pr) => `- #${pr.number} ${pr.title}`)
              : ['- No merged PRs to dev found for this release range.'];

            const body = [
              title,
              '',
              rangeLine,
              '',
              ...prLines,
              '',
              '## Assets',
              '',
              '- macOS Apple Silicon DMG',
              '- Windows x64 NSIS installer',
            ].join('\n');

            const notesPath = path.join(process.env.GITHUB_WORKSPACE, 'release-notes.md');
            fs.writeFileSync(notesPath, body, 'utf8');
      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon DMG
            enabled_input: build_macos
            os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact_name: kaif-vpnchik-macos-aarch64-dmg
            artifact_path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows x64 NSIS installer
            enabled_input: build_windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact_name: kaif-vpnchik-windows-x64-nsis
            artifact_path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    steps:
      - name: Skip if disabled
        if: github.event_name == 'workflow_dispatch' && github.event.inputs[matrix.enabled_input] != 'true'
        run: echo "Skipping ${{ matrix.name }}"

      - name: Checkout
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/checkout@v6

      - name: Install Rust
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: kaif-${{ matrix.os }}-${{ matrix.target }}
          workspaces: . -> target

      - name: Install pnpm
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Install Node
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies and runtime resources
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        run: |
          pnpm i
          pnpm run prebuild ${{ matrix.target }}

      - name: Build installer
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          tauriScript: pnpm
          args: --target ${{ matrix.target }} -b ${{ matrix.bundle }}

      - name: Add macOS help.txt to DMG
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true') && matrix.os == 'macos-latest'
        run: node scripts/rebuild-macos-dmg-with-help.mjs ${{ matrix.target }}

      - name: Upload installer
        if: github.event_name != 'workflow_dispatch' || github.event.inputs[matrix.enabled_input] == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          archive: false

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - build
      - generate-release-notes
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: kaif-vpnchik-*
          merge-multiple: true
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@v7
        with:
          name: release-notes
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: dist/release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/**/*.dmg
            dist/**/*.exe
